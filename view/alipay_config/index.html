<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>支付宝配置</title>
    <link rel="stylesheet" href="/component/pear/css/pear.css" />
    <style>
        .help-text {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <form id="alipay-config" class="layui-form layui-form-pane" action="" lay-filter="alipay-config">
        <div class="mainBox">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">应用ID</label>
                    <div class="layui-input-block">
                        <input type="text" name="app_id" autocomplete="off" class="layui-input"
                            value="<?php echo $app_id ?>" placeholder="支付宝开放平台应用AppId">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">应用私钥</label>
                    <div class="layui-input-block">
                        <textarea name="private_key" class="layui-textarea" rows="4"
                            placeholder="使用密钥工具生成的应用私钥"><?php echo $private_key ?></textarea>
                        <div class="help-text">RSA2 密钥工具生成，去除头尾标识也可</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">支付宝公钥</label>
                    <div class="layui-input-block">
                        <textarea name="alipay_public_key" class="layui-textarea" rows="4"
                            placeholder="从支付宝开放平台获取"><?php echo $alipay_public_key ?></textarea>
                        <div class="help-text">注意：是支付宝公钥，不是应用公钥</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">用户ID</label>
                    <div class="layui-input-block">
                        <input type="text" name="transfer_user_id" autocomplete="off" class="layui-input"
                            value="<?php echo $transfer_user_id ?>" placeholder="支付宝账户中心的账号ID">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">查询范围(分)</label>
                    <div class="layui-input-block">
                        <input type="number" name="query_minutes_back" autocomplete="off" class="layui-input"
                            value="<?php echo $query_minutes_back ?>" placeholder="默认30分钟">
                        <div class="help-text">每次定时任务查询最近多少分钟的账单，建议30-60</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="bottom">
            <div class="button-container">
                <button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit=""
                    lay-filter="config-save">
                    <i class="layui-icon layui-icon-ok"></i>
                    保存配置
                </button>
            </div>
        </div>
    </form>
    <script src="/component/layui/layui.js"></script>
    <script src="/component/pear/pear.js"></script>
    <script>
        layui.use(['form'], function () {
            let form = layui.form;

            form.on('submit(config-save)', function (obj) {
                let field = obj.field;
                (async () => {
                    const url = '/api/AlipayConfig/saveConfig';
                    const res = await fetch(url, {
                        method: 'post',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(field)
                    });
                    if (res.status !== 200) {
                        layer.msg('请求失败，请重试！', { tips: 2, time: 1200 });
                        return false;
                    }
                    const rec_info = await res.json();
                    if (rec_info.code === 0) {
                        layer.msg(rec_info.msg, { icon: 1, time: 1200 });
                    } else {
                        layer.msg(rec_info.msg, { icon: 2, time: 1200 });
                    }
                })()
                return false;
            });
        })
    </script>
</body>

</html>
